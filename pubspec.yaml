name: raagaflow
description: RaagaFlow — India-first music streaming app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & Networking
  http: ^1.2.1
  dio: ^5.4.3
  dio_cache_interceptor: ^3.5.0

  # Audio Engine
  just_audio: ^0.9.40
  audio_service: ^0.18.14
  audio_session: ^0.1.25

  # YouTube Music (Primary Source)
  youtube_explode_dart: ^3.0.5

  # Local Database
  hive_ce: any
  hive_ce_flutter: any

  # UI & Animation
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3+3
  shimmer: ^3.0.0

  # Navigation
  go_router: ^14.2.7

  # Utilities
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_ce_generator: any
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F0C0B"
  image: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    color: "#0F0C0B"
